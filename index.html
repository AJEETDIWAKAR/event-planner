<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celebration Event Planner</title>
    <meta
      name="description"
      content="Plan weddings, birthdays and community events with budgets, timelines and vendor checklists."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <h1>Celebration Event Planner</h1>
      <p>GenAI-assisted planning for weddings, birthdays and community events.</p>
    </header>
    <main id="main">
      <section aria-labelledby="form-h">
        <h2 id="form-h">Event details</h2>
        <form id="plan-form" novalidate>
          <label for="eventType">Event type</label>
          <select id="eventType" name="eventType">
            <option value="wedding">Wedding</option>
            <option value="birthday">Birthday</option>
            <option value="community">Community event</option>
          </select>
          <label for="eventName">Event name</label>
          <input id="eventName" name="eventName" type="text" maxlength="100" required />
          <label for="budget">Total budget (INR)</label>
          <input id="budget" name="budget" type="number" min="1000" step="1000" required />
          <label for="guestCount">Guest count</label>
          <input id="guestCount" name="guestCount" type="number" min="5" max="50000" required />
          <label for="eventDate">Event date</label>
          <input id="eventDate" name="eventDate" type="date" required />
          <label for="preferences">Preferences (theme, food, culture)</label>
          <textarea id="preferences" name="preferences" maxlength="300" rows="3"></textarea>
          <button type="submit" id="submit-btn">Generate plan</button>
          <button type="button" id="reset-btn" class="secondary">Clear saved plan</button>
        </form>
        <div id="errors" role="alert" aria-live="assertive" tabindex="-1"></div>
      </section>

      <div id="results" hidden>
        <section aria-labelledby="sum-h">
          <h2 id="sum-h">Overview</h2>
          <p id="summary"></p>
          <p id="meta" class="muted"></p>
        </section>
        <section aria-labelledby="ideas-h">
          <h2 id="ideas-h">Personalized ideas</h2>
          <ul id="ideas" class="cards"></ul>
        </section>
        <section aria-labelledby="bud-h">
          <h2 id="bud-h">Budget tracker</h2>
          <p id="budget-summary" aria-live="polite"></p>
          <div id="budget-list"></div>
        </section>
        <section aria-labelledby="time-h">
          <h2 id="time-h">Timeline</h2>
          <p id="timeline-progress" aria-live="polite"></p>
          <ol id="timeline"></ol>
        </section>
        <section aria-labelledby="ven-h">
          <h2 id="ven-h">Vendor checklist</h2>
          <p id="vendor-progress" aria-live="polite"></p>
          <ul id="vendors" class="cards"></ul>
          <form id="vendor-form" novalidate>
            <label for="vName">Add custom vendor</label>
            <input id="vName" type="text" maxlength="70" />
            <button type="submit">Add</button>
          </form>
        </section>
      </div>
    </main>
    <footer><p>Plans are saved only in your browser.</p></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
